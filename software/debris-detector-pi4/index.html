<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Pi4 碎屑检测</title>
<style>body{font:16px system-ui;margin:24px auto;max-width:1100px;padding:0 18px;background:#eff4f7;color:#183544}section{background:white;border-radius:12px;padding:18px;margin:16px 0}button,input,select{font:inherit;padding:8px;margin:5px}button{cursor:pointer}input{width:85px}canvas{width:100%;max-width:640px;background:#142d3a;cursor:crosshair}#mask{width:100%;max-width:320px;background:#142d3a}#message{color:#9b4b16;min-height:28px}table{border-collapse:collapse;width:100%}td,th{padding:8px;text-align:left;border-bottom:1px solid #dce5eb}small{color:#566e7c}.views{display:flex;flex-wrap:wrap;gap:14px;align-items:start}.help{max-width:320px}h1{margin-bottom:5px}</style>
<h1>Raspberry Pi 4B · 碎屑检测</h1><p>OV5647 实时预览、检测框与左右方向。当前只检测，电机保持断开。</p>
<section><div class="views"><canvas id="view" width="640" height="480"></canvas><div class="help"><h3>检测掩膜</h3><img id="mask" alt="白色区域为候选"><p>蓝框：检测区域。黄线：画面中心。绿框：候选目标。</p><p>左／右按画面中心判断；尚未标定为机器人方向或距离。</p></div></div><div id="message"></div><strong id="status">等待相机…</strong><p id="stats"></p>
<button id="reference">拍空桌面参考</button><button id="pick">暂停并取色</button><button id="roi">暂停并选择区域</button><button id="resume">恢复预览</button><button id="full">恢复默认区域</button></section>
<section><label>检测模式 <select id="mode"><option value="background">空桌面参考</option><option value="color">目标颜色</option></select></label>
<label>差异阈值 <input id="threshold" type="number" min="1" max="255" value="28"></label><label>最小面积 <input id="min_area" type="number" min="1" value="40"></label><label>最大面积 <input id="max_area" type="number" min="1" value="20000"></label><br>
<label>最大长宽比(0关闭) <input id="max_aspect" type="number" min="0" max="100" value="0"></label><label>最小填充率% <input id="min_fill_percent" type="number" min="0" max="100" value="0"></label><br>
<label>色相容差 <input id="hue_tolerance" type="number" min="1" max="90" value="12"></label><label>明暗/饱和容差 <input id="sv_tolerance" type="number" min="1" max="255" value="65"></label><button id="apply">应用设置</button><button id="preset">纸屑降误检参数起点</button>
<p><small>空桌面模式：车身、相机和光照保持不变。颜色模式：先选纯色目标，桌面上其他同色区域也会被识别。两种模式都不是通用垃圾分类模型。最大长宽比可排除细长线条；填充率是轮廓面积占框面积的百分比。过滤也可能漏掉细长/不规则碎片，0表示关闭。</small></p></section>
<section><h2>候选碎屑</h2><div id="results">暂无</div><small>编号按面积排序，可能逐帧变化；不是稳定跟踪ID。检测框不能证明已收集成功。</small></section>
<script>
const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d');
let paused=false,mode='',points=[],image=null,frameId=null,latestSettings=null,settingsLoaded=false;
function message(s){$('message').textContent=s}
async function post(path,data={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||r.status);return d}
function draw(){if(image)ctx.drawImage(image,0,0);ctx.fillStyle='#ffb400';for(const p of points){ctx.beginPath();ctx.arc(...p,5,0,2*Math.PI);ctx.fill()}}
function clearResults(){ctx.clearRect(0,0,640,480);$('mask').removeAttribute('src');$('results').textContent='无有效图像';$('stats').textContent='';image=null;frameId=null}
async function loop(){try{if(!paused){const r=await fetch('/state'),d=await r.json();if(!r.ok||d.error)throw Error(d.error||r.status);const im=new Image();im.src='data:image/jpeg;base64,'+d.jpeg;await im.decode();if(!paused){image=im;frameId=d.frame_id;latestSettings=d.settings;draw();if(!settingsLoaded){setForm(d.settings);settingsLoaded=true;}$('mask').src='data:image/jpeg;base64,'+d.mask_jpeg;$('status').textContent=d.status;$('stats').textContent=`当前${d.settings.mode==='background'?'空桌面':'颜色'}模式 · 候选数 ${d.count} · 本次采集和处理 ${d.processing_ms} ms`;let h='<table><tr><th>编号</th><th>方向</th><th>中心像素</th><th>面积</th><th>横向偏移</th></tr>';for(const [i,t] of d.targets.entries()){const dir={LEFT:'左',RIGHT:'右',CENTER:'中间'}[t.direction];h+=`<tr><td>${i+1}</td><td>${dir}</td><td>${t.center_px.join(', ')}</td><td>${t.area_px}</td><td>${t.offset_x_px} px</td></tr>`}$('results').innerHTML=h+'</table>'}}}catch(e){$('status').textContent='图像不可用：'+e.message;clearResults()}finally{setTimeout(loop,200)}}
$('apply').onclick=async()=>{try{const data={mode:$('mode').value};for(const k of ['threshold','min_area','max_area','hue_tolerance','sv_tolerance','max_aspect','min_fill_percent'])data[k]=+$(k).value;await post('/settings',data);message('设置已应用')}catch(e){message(e.message)}};
function setForm(cfg){for(const key of ['mode','threshold','min_area','max_area','hue_tolerance','sv_tolerance','max_aspect','min_fill_percent'])if(cfg[key]!==undefined)$(key).value=cfg[key]}
$('preset').onclick=async()=>{try{const cfg={mode:'background',threshold:40,min_area:150,max_area:5000,max_aspect:8,min_fill_percent:25};const r=await post('/settings',cfg);setForm(r.settings);message('纸屑参数已应用。先缩小区域、清空桌面后重拍参考；这是调参起点，仍需检查漏检。')}catch(e){message(e.message)}};
$('reference').onclick=async()=>{try{message('请移开手、清空区域，正在拍摄…');const r=await post('/reference');message(r.message)}catch(e){message(e.message)}};
function freeze(next){if(!image)return message('先等待有效图像');paused=true;mode=next;points=[];draw();message(next==='pick'?'点击碎屑中央的纯色区域':'依次点击检测矩形的两个对角；至少32×32像素')}
$('pick').onclick=()=>freeze('pick');$('roi').onclick=()=>freeze('roi');$('resume').onclick=()=>{paused=false;mode='';points=[];message('实时预览已恢复')};
$('full').onclick=async()=>{try{await post('/settings',{roi:[32,96,576,360]});paused=false;points=[];mode='';message('已恢复默认区域')}catch(e){message(e.message)}};
canvas.onclick=async e=>{if(!paused||!image)return;const r=canvas.getBoundingClientRect(),p=[Math.min(639,Math.max(0,Math.round((e.clientX-r.left)*640/r.width))),Math.min(479,Math.max(0,Math.round((e.clientY-r.top)*480/r.height)))];try{if(mode==='pick'){const result=await post('/pick',{frame_id:frameId,u:p[0],v:p[1]});$('mode').value='color';message(result.message);paused=false;mode=''}else if(mode==='roi'){points.push(p);draw();if(points.length===2){const a=points[0],b=points[1],roi=[Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0])+1,Math.abs(b[1]-a[1])+1];await post('/settings',{roi});message('检测区域已更新');paused=false;mode='';points=[]}}}catch(e){points=[];draw();message(e.message)}};
loop();
</script></html>
