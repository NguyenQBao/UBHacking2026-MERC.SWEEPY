<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>METALSWEEP Control</title>
<style>body{font:17px system-ui;max-width:950px;margin:24px auto;padding:0 18px;background:#eef3f5;color:#17303a}button{padding:14px;margin:5px;font-size:17px;border:1px solid #9aa;border-radius:8px;cursor:pointer}#stop{background:#a71925;color:white;font-weight:bold;font-size:22px}img{width:100%;max-width:640px;background:#123;min-height:100px}pre{white-space:pre-wrap;background:white;padding:15px}#error{color:#9d1722}a{color:#075866}</style>
<h1>Camera · Wheels · Brush</h1>
<p>Simulation mode by default. Each click runs one short pulse. Auto collects one target only, then stops for you to check. Keep this page in the foreground.</p>
<button id="stop" data-cmd="stop">STOP ALL / Space</button>
<p id="error"></p><img id="view" alt="Waiting for camera"><p id="pixel">Click the image to see pixel coordinates for calibration.</p>
<div><button data-cmd="forward">Forward step</button><button data-cmd="back">Back step</button>
<button data-cmd="left">Turn left step</button><button data-cmd="right">Turn right step</button>
<button data-cmd="brush">Brush pulse</button><button data-cmd="auto">Collect one target</button></div>
<p><a href="/raw.jpg" download="calibration.jpg">Save raw image for calibration</a></p>
<pre id="state">Connecting…</pre>
<script>
const token='__TOKEN__', view=document.querySelector('#view'), error=document.querySelector('#error');
async function command(command){try{const r=await fetch('/command',{method:'POST',headers:{'Content-Type':'application/json','X-Control-Token':token},body:JSON.stringify({command}),signal:AbortSignal.timeout(1500)});const d=await r.json();if(!r.ok)throw Error(d.error);error.textContent=''}catch(e){error.textContent=e.message}}
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>command(b.dataset.cmd));
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();command('stop')}});
addEventListener('blur',()=>command('stop'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)command('stop')});
setInterval(()=>{if(!document.hidden&&document.hasFocus())command('heartbeat')},500);
view.onclick=e=>{const r=view.getBoundingClientRect();document.querySelector('#pixel').textContent=`u=${Math.round((e.clientX-r.left)*640/r.width)}, v=${Math.round((e.clientY-r.top)*480/r.height)}`};
let previous;
async function poll(){try{const r=await fetch('/state',{signal:AbortSignal.timeout(1500)});if(!r.ok)throw Error('Failed to read state');document.querySelector('#state').textContent=JSON.stringify(await r.json(),null,2);const f=await fetch('/frame.jpg',{signal:AbortSignal.timeout(1500)});if(f.ok){const next=URL.createObjectURL(await f.blob());view.src=next;if(previous)URL.revokeObjectURL(previous);previous=next}}catch(e){error.textContent=e.message}setTimeout(poll,300)}poll();
</script></html>
