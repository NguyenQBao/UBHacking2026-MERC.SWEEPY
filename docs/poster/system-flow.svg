<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1096" width="1800" height="1096" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="a4a5a60" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5a60"/></marker><marker id="a1d7a56" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d7a56"/></marker><marker id="a2558a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2558a8"/></marker><marker id="ab06a10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b06a10"/></marker><marker id="aa1323b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1323b"/></marker></defs><rect width="1800" height="1096" fill="#ffffff"/><text x="40" y="136" font-size="17" font-weight="800" fill="#1d7a56" text-anchor="start">OFFLINE · TRAINING LOOP</text><text x="40" y="156" font-size="13.5" font-weight="400" fill="#55666b" text-anchor="start">Pi collects photos, Mac labels and trains</text><text x="490" y="136" font-size="17" font-weight="800" fill="#2558a8" text-anchor="start">ONBOARD PERCEPTION</text><text x="490" y="156" font-size="13.5" font-weight="400" fill="#55666b" text-anchor="start">Raspberry Pi 4B, every frame</text><text x="940" y="136" font-size="17" font-weight="800" fill="#b06a10" text-anchor="start">DECISION · CLOSED LOOP</text><text x="940" y="156" font-size="13.5" font-weight="400" fill="#55666b" text-anchor="start">one target per cycle, re-look after every move</text><text x="1390" y="136" font-size="17" font-weight="800" fill="#a1323b" text-anchor="start">ACTUATION &amp; OPERATOR</text><text x="1390" y="156" font-size="13.5" font-weight="400" fill="#55666b" text-anchor="start">GPIO outputs, human in the loop</text><rect x="40" y="190" width="370" height="112" rx="12" fill="#e6f4ee" stroke="#1d7a56" stroke-width="2"/><circle cx="64" cy="216" r="14" fill="#1d7a56"/><text x="64" y="221" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="86" y="222" font-size="19" font-weight="700" fill="#1d7a56" text-anchor="start">Collect</text><text x="58" y="250" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">Pi data collector (:8092)</text><text x="58" y="271" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">train / val / test by scene, ~20% empty floor</text><rect x="40" y="328" width="370" height="112" rx="12" fill="#e6f4ee" stroke="#1d7a56" stroke-width="2"/><circle cx="64" cy="354" r="14" fill="#1d7a56"/><text x="64" y="359" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="86" y="360" font-size="19" font-weight="700" fill="#1d7a56" text-anchor="start">Label</text><text x="58" y="388" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">Training studio (:8090) on Mac</text><text x="58" y="409" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">tight box per debris, confirm empty shots</text><rect x="40" y="466" width="370" height="112" rx="12" fill="#e6f4ee" stroke="#1d7a56" stroke-width="2"/><circle cx="64" cy="492" r="14" fill="#1d7a56"/><text x="64" y="497" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="86" y="498" font-size="19" font-weight="700" fill="#1d7a56" text-anchor="start">Train YOLO11n</text><text x="58" y="526" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">single class &quot;debris&quot;, 640 px</text><text x="58" y="547" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">fresh or cumulative, keep best epoch</text><rect x="40" y="604" width="370" height="112" rx="12" fill="#e6f4ee" stroke="#1d7a56" stroke-width="2"/><circle cx="64" cy="630" r="14" fill="#1d7a56"/><text x="64" y="635" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="86" y="636" font-size="19" font-weight="700" fill="#1d7a56" text-anchor="start">Evaluate</text><text x="58" y="664" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">independent test scene</text><text x="58" y="685" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">Precision · Recall · mAP50</text><rect x="40" y="742" width="370" height="112" rx="12" fill="#e6f4ee" stroke="#1d7a56" stroke-width="2"/><circle cx="64" cy="768" r="14" fill="#1d7a56"/><text x="64" y="773" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="86" y="774" font-size="19" font-weight="700" fill="#1d7a56" text-anchor="start">Export NCNN</text><text x="58" y="802" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">~10 MB model for ARM CPU</text><text x="58" y="823" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">copy to Pi, run.py --model</text><rect x="490" y="190" width="370" height="112" rx="12" fill="#e8eff9" stroke="#2558a8" stroke-width="2"/><circle cx="514" cy="216" r="14" fill="#2558a8"/><text x="514" y="221" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="536" y="222" font-size="19" font-weight="700" fill="#2558a8" text-anchor="start">Camera</text><text x="508" y="250" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">OV5647 CSI, 640×480</text><text x="508" y="271" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">mounted on post, tilted to floor</text><rect x="490" y="328" width="370" height="112" rx="12" fill="#e8eff9" stroke="#2558a8" stroke-width="2"/><circle cx="514" cy="354" r="14" fill="#2558a8"/><text x="514" y="359" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="536" y="360" font-size="19" font-weight="700" fill="#2558a8" text-anchor="start">Detect</text><text x="508" y="388" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">YOLO11n NCNN → boxes + score</text><text x="508" y="409" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">keep score ≥ 0.4  (≈0.3–0.7 s / frame)</text><rect x="490" y="466" width="370" height="112" rx="12" fill="#e8eff9" stroke="#2558a8" stroke-width="2"/><circle cx="514" cy="492" r="14" fill="#2558a8"/><text x="514" y="497" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="536" y="498" font-size="19" font-weight="700" fill="#2558a8" text-anchor="start">Ground mapping</text><text x="508" y="526" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">homography from 6+ ruler points</text><text x="508" y="547" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">pixel → X,Y mm from scoop (fit 2.6 mm)</text><rect x="490" y="604" width="370" height="112" rx="12" fill="#e8eff9" stroke="#2558a8" stroke-width="2"/><circle cx="514" cy="630" r="14" fill="#2558a8"/><text x="514" y="635" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="536" y="636" font-size="19" font-weight="700" fill="#2558a8" text-anchor="start">Track target</text><text x="508" y="664" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">nearest target, match by centre</text><text x="508" y="685" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">must persist 2–3 fresh frames</text><rect x="940" y="190" width="370" height="112" rx="12" fill="#fdf2e2" stroke="#b06a10" stroke-width="2"/><circle cx="964" cy="216" r="14" fill="#b06a10"/><text x="964" y="221" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="986" y="222" font-size="19" font-weight="700" fill="#b06a10" text-anchor="start">Observe</text><text x="958" y="250" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">target inside 0 &lt; Y ≤ 700 mm?</text><text x="958" y="271" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">none / lost → stop, never search blind</text><rect x="940" y="328" width="370" height="112" rx="12" fill="#fdf2e2" stroke="#b06a10" stroke-width="2"/><circle cx="964" cy="354" r="14" fill="#b06a10"/><text x="964" y="359" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="986" y="360" font-size="19" font-weight="700" fill="#b06a10" text-anchor="start">Align</text><text x="958" y="388" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">turn ≈4° steps toward target</text><text x="958" y="409" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">until |angle| ≤ 6° and |X| ≤ 15 mm</text><rect x="940" y="466" width="370" height="112" rx="12" fill="#fdf2e2" stroke="#b06a10" stroke-width="2"/><circle cx="964" cy="492" r="14" fill="#b06a10"/><text x="964" y="497" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="986" y="498" font-size="19" font-weight="700" fill="#b06a10" text-anchor="start">Approach</text><text x="958" y="526" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">drive ≈5 cm step, stop, re-look</text><text x="958" y="547" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">repeat until Y ≤ 200 mm</text><rect x="940" y="604" width="370" height="112" rx="12" fill="#fdf2e2" stroke="#b06a10" stroke-width="2"/><circle cx="964" cy="630" r="14" fill="#b06a10"/><text x="964" y="635" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="986" y="636" font-size="19" font-weight="700" fill="#b06a10" text-anchor="start">Collect</text><text x="958" y="664" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">brush spin-up 0.35 s → blind push</text><text x="958" y="685" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">t = (Y + 40) / 483 mm/s → brush tail</text><rect x="940" y="742" width="370" height="112" rx="12" fill="#fdf2e2" stroke="#b06a10" stroke-width="2"/><circle cx="964" cy="768" r="14" fill="#b06a10"/><text x="964" y="773" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="986" y="774" font-size="19" font-weight="700" fill="#b06a10" text-anchor="start">Stop &amp; verify</text><text x="958" y="802" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">car parks, operator checks scoop</text><text x="958" y="823" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">start next cycle manually</text><rect x="1390" y="190" width="370" height="112" rx="12" fill="#fbe9ea" stroke="#a1323b" stroke-width="2"/><circle cx="1414" cy="216" r="14" fill="#a1323b"/><text x="1414" y="221" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="1436" y="222" font-size="19" font-weight="700" fill="#a1323b" text-anchor="start">Drive wheels</text><text x="1408" y="250" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">L298N H-bridge, PWM</text><text x="1408" y="271" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">R: 17/27/18 · L: 22/23/13</text><rect x="1390" y="328" width="370" height="112" rx="12" fill="#fbe9ea" stroke="#a1323b" stroke-width="2"/><circle cx="1414" cy="354" r="14" fill="#a1323b"/><text x="1414" y="359" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="1436" y="360" font-size="19" font-weight="700" fill="#a1323b" text-anchor="start">Brush</text><text x="1408" y="388" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">relay GPIO21 → CCM6N → 12 V motor</text><text x="1408" y="409" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">bristles sweep debris onto scoop</text><rect x="1390" y="466" width="370" height="112" rx="12" fill="#fbe9ea" stroke="#a1323b" stroke-width="2"/><circle cx="1414" cy="492" r="14" fill="#a1323b"/><text x="1414" y="497" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="1436" y="498" font-size="19" font-weight="700" fill="#a1323b" text-anchor="start">Buzzer</text><text x="1408" y="526" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">GPIO12</text><text x="1408" y="547" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">short beep when debris appears</text><rect x="1390" y="604" width="370" height="112" rx="12" fill="#fbe9ea" stroke="#a1323b" stroke-width="2"/><circle cx="1414" cy="630" r="14" fill="#a1323b"/><text x="1414" y="635" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1436" y="636" font-size="19" font-weight="700" fill="#a1323b" text-anchor="start">Operator panel</text><text x="1408" y="664" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">web page :8091 · live view</text><text x="1408" y="685" font-size="14.5" font-weight="400" fill="#16262c" text-anchor="start">sliders, STOP / Space, heartbeat</text><path d="M225.0,302 L225.0,325" fill="none" stroke="#1d7a56" stroke-width="2.5"  marker-end="url(#a1d7a56)"/><path d="M225.0,440 L225.0,463" fill="none" stroke="#1d7a56" stroke-width="2.5"  marker-end="url(#a1d7a56)"/><path d="M225.0,578 L225.0,601" fill="none" stroke="#1d7a56" stroke-width="2.5"  marker-end="url(#a1d7a56)"/><path d="M225.0,716 L225.0,739" fill="none" stroke="#1d7a56" stroke-width="2.5"  marker-end="url(#a1d7a56)"/><path d="M675.0,302 L675.0,325" fill="none" stroke="#2558a8" stroke-width="2.5"  marker-end="url(#a2558a8)"/><path d="M675.0,440 L675.0,463" fill="none" stroke="#2558a8" stroke-width="2.5"  marker-end="url(#a2558a8)"/><path d="M675.0,578 L675.0,601" fill="none" stroke="#2558a8" stroke-width="2.5"  marker-end="url(#a2558a8)"/><path d="M1125.0,302 L1125.0,325" fill="none" stroke="#b06a10" stroke-width="2.5"  marker-end="url(#ab06a10)"/><path d="M1125.0,440 L1125.0,463" fill="none" stroke="#b06a10" stroke-width="2.5"  marker-end="url(#ab06a10)"/><path d="M1125.0,578 L1125.0,601" fill="none" stroke="#b06a10" stroke-width="2.5"  marker-end="url(#ab06a10)"/><path d="M1125.0,716 L1125.0,739" fill="none" stroke="#b06a10" stroke-width="2.5"  marker-end="url(#ab06a10)"/><path d="M40,660.0 L22,660.0 L22,246.0 L37,246.0" fill="none" stroke="#1d7a56" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a1d7a56)"/><text transform="translate(16,453.0) rotate(-90)" font-size="13.5" font-weight="600" fill="#1d7a56" text-anchor="middle">misses &amp; false alarms → shoot more</text><path d="M410,798.0 L450,798.0 L450,384.0 L487,384.0" fill="none" stroke="#1d7a56" stroke-width="2.5"  marker-end="url(#a1d7a56)"/><text x="452" y="788.0" font-size="13.5" font-weight="600" fill="#1d7a56" text-anchor="start">deploy model</text><path d="M860,660.0 L905,660.0 L905,246.0 L937,246.0" fill="none" stroke="#2558a8" stroke-width="2.5"  marker-end="url(#a2558a8)"/><text transform="translate(898,522.0) rotate(-90)" font-size="13.5" font-weight="600" fill="#2558a8" text-anchor="middle">target X,Y (mm)</text><path d="M1310,384.0 L1387,246.0" fill="none" stroke="#b06a10" stroke-width="2.5"  marker-end="url(#ab06a10)"/><path d="M1310,522.0 L1387,268.0" fill="none" stroke="#b06a10" stroke-width="2.5"  marker-end="url(#ab06a10)"/><path d="M1310,660.0 L1387,384.0" fill="none" stroke="#b06a10" stroke-width="2.5"  marker-end="url(#ab06a10)"/><text x="1318" y="684.0" font-size="13.5" font-weight="600" fill="#b06a10" text-anchor="start">brush +</text><text x="1318" y="701.0" font-size="13.5" font-weight="600" fill="#b06a10" text-anchor="start">push</text><path d="M735.0,440 L735.0,452 L1365,452 L1365,522.0 L1387,522.0" fill="none" stroke="#2558a8" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a2558a8)"/><path d="M940,556 L924,556 L924,180 L675.0,180 L675.0,187" fill="none" stroke="#b06a10" stroke-width="2.5